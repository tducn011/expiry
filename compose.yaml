services:
  mysql:
    image: mysql:8.4
    container_name: expiry-mysql84
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --authentication-policy=caching_sha2_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-expiry_dev}
      MYSQL_USER: ${MYSQL_USER:-expiry_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_dev_password}
    ports:
      - "0.0.0.0:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/mysql/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  python-scan:
    build:
      context: ./services/python-scan
      dockerfile: Dockerfile
      args:
        ENABLE_DATEREG: ${ENABLE_DATEREG:-false}
    container_name: expiry-python-scan
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      VISION_LLM_PROVIDER: ${VISION_LLM_PROVIDER:-auto}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: expiry-api
    restart: unless-stopped
    ports:
      - "0.0.0.0:3001:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-expiry_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_dev_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-expiry_dev}
      SCAN_SERVICE_URL: http://python-scan:8000
      SCAN_TIMEOUT_MS: 10000
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8443,http://127.0.0.1:8443,http://100.80.6.17:8443,https://demoexpiry.vercel.app,https://expiryapp.vercel.app,https://expiry.vercel.app,https://uidemo.vercel.app}
    depends_on:
      mysql:
        condition: service_healthy
      python-scan:
        condition: service_started

  adminer:
    image: adminer:latest
    container_name: expiry-adminer
    restart: unless-stopped
    ports:
      - "0.0.0.0:8085:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
